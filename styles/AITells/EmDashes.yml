# House rule: at most one em-dash per paragraph (technical-writing,
# "Commits, comments, and the em-dash rule"). The script skips
# frontmatter, code fences, inline code, and link labels such as
# [Page — Section]. Each list item and table row counts as its own
# paragraph. Level is warning until the four existing hits in
# components/kustomize.md and components/terraform.md are rewritten;
# raise it to error after that.
extends: script
message: "More than one em-dash in this paragraph. Keep one at most; use a comma, colon, or parentheses, or split the sentence."
level: warning
scope: raw
script: |
  text := import("text")
  matches := []

  lines := text.split(scope, "\n")
  pos := 0
  in_fence := false
  in_front := false
  para_start := -1
  count := 0
  second := -1

  flush := func() {
    if count > 1 {
      matches = append(matches, {begin: second, end: second + 3})
    }
    para_start = -1
    count = 0
    second = -1
  }

  for i, line in lines {
    trimmed := text.trim_space(line)
    if i == 0 && trimmed == "---" {
      in_front = true
    } else if in_front {
      if trimmed == "---" { in_front = false }
    } else if text.has_prefix(trimmed, "```") || text.has_prefix(trimmed, "~~~") {
      flush()
      in_fence = !in_fence
    } else if in_fence {
      // code: ignored
    } else if trimmed == "" {
      flush()
    } else {
      if text.re_match(`^([-*+]|\d+[.)]|\|)\s`, trimmed) || text.has_prefix(trimmed, "|") { flush() }
      if para_start < 0 { para_start = pos }
      in_code := false
      depth := 0
      j := 0
      for j < len(line) {
        c := line[j]
        if c == '`' {
          in_code = !in_code
        } else if !in_code && c == '[' {
          depth += 1
        } else if !in_code && c == ']' && depth > 0 {
          depth -= 1
        } else if !in_code && depth == 0 && text.has_prefix(line[j:], "—") {
          count += 1
          if count == 2 { second = pos + j }
        }
        j += 1
      }
    }
    pos += len(line) + 1
  }
  flush()
